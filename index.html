<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLATTERS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        /* ============================================================
           БАЗА
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body.dark {
            background: #0a0a0a;
            color: #f0f0f0;
        }

        .container {
            max-width: 560px;
            width: 100%;
            text-align: left;
        }

        /* ============================================================
           ЗАГОЛОВОК
           ============================================================ */
        .brand {
            font-family: 'Syne', sans-serif;
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -2px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 4px;
        }

        .sub-brand {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 400;
            opacity: 0.4;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        /* ============================================================
           ОПИСАНИЕ
           ============================================================ */
        .desc {
            font-size: 16px;
            line-height: 1.7;
            opacity: 0.6;
            max-width: 400px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* ============================================================
           КНОПКИ
           ============================================================ */
        .btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 340px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.3s ease;
            border: 2px solid #000000;
            background: transparent;
            color: #000000;
            cursor: pointer;
        }

        body.dark .btn {
            border-color: #ffffff;
            color: #ffffff;
        }

        .btn .icon {
            font-size: 20px;
            opacity: 0.4;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #000000;
            color: #ffffff;
            transform: scale(1.02);
        }

        body.dark .btn:hover {
            background: #ffffff;
            color: #0a0a0a;
        }

        .btn:hover .icon {
            opacity: 1;
        }

        /* ============================================================
           ТУМБЛЕР ТЕМЫ
           ============================================================ */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            transition: all 0.3s;
        }

        body.dark .theme-toggle {
            border-color: rgba(255, 255, 255, 0.1);
            color: #f0f0f0;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: #000;
        }

        body.dark .theme-toggle:hover {
            border-color: #fff;
        }

        .theme-toggle .material-symbols-outlined {
            font-size: 24px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-toggle.rotated .material-symbols-outlined {
            transform: rotate(180deg);
        }

        /* ============================================================
           ФУТЕР
           ============================================================ */
        .footer {
            margin-top: 48px;
            font-size: 12px;
            opacity: 0.2;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */
        @media (max-width: 480px) {
            .brand {
                font-size: 44px;
            }

            .sub-brand {
                font-size: 17px;
            }

            .desc {
                font-size: 14px;
            }

            .btn {
                font-size: 16px;
                padding: 14px 18px;
            }

            .theme-toggle {
                top: 16px;
                right: 16px;
                width: 38px;
                height: 38px;
            }

            .theme-toggle .material-symbols-outlined {
                font-size: 20px;
            }

            .btns {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
       ТУМБЛЕР ТЕМЫ
       ============================================================ -->
    <button class="theme-toggle" id="themeToggle" aria-label="Тема">
        <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
    </button>

    <!-- ============================================================
       КОНТЕНТ
       ============================================================ -->
    <div class="container">

        <div class="brand">PLATTERS</div>
        <div class="sub-brand">— рофл-сайт на вайб-коде</div>

        <p class="desc">
            Не имеет никакой связи с настоящей компанией (которой и так нет).<br />
            Но планы имеются.
        </p>

        <div class="btns">
            <!-- Мобайл -->
            <a href="/mob" class="btn">
                <span>PLTRS.MOBILE</span>
                <span class="icon material-symbols-outlined">arrow_forward</span>
            </a>

            <!-- Банк -->
            <a href="/bank" class="btn">
                <span>PLTRS.BANK</span>
                <span class="icon material-symbols-outlined">close</span>
            </a>
        </div>

        <div class="footer">pltrs © 2026</div>

    </div>

    <!-- ============================================================
       СКРИПТ
       ============================================================ -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeIcon.textContent = isDark ? 'light_mode' : 'dark_mode';
            themeToggle.classList.toggle('rotated');
            localStorage.setItem('pltrs_main_theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            const theme = localStorage.getItem('pltrs_main_theme');
            if (theme === 'dark') {
                document.body.classList.add('dark');
                themeIcon.textContent = 'light_mode';
                themeToggle.classList.add('rotated');
            } else {
                document.body.classList.remove('dark');
                themeIcon.textContent = 'dark_mode';
                themeToggle.classList.remove('rotated');
            }
        }

        themeToggle.addEventListener('click', toggleTheme);
        document.addEventListener('DOMContentLoaded', loadTheme);
    </script>

</body>
</html>
